[package]
name = "definy-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { workspace = true, features = ["macro", "hooks", "signals", "html"] }
base64 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
definy-event = { workspace = true }
web-sys = { workspace = true, features = [
  "console",
  "Window",
  "History",
  "Document",
  "Element",
  "Node",
  "NodeList",
  "HtmlElement",
  "Event",
  "HtmlDialogElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "Navigator",
  "Clipboard",
  "DomStringList",
  "IdbDatabase",
  "IdbFactory",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbVersionChangeEvent",
  "Request",
  "RequestInit",
  "Response",
  "Headers",
  "CredentialsContainer",
  "CredentialRequestOptions",
  "Storage",
  "Location",
] }
wasm-bindgen = { workspace = true }
rand_core = { workspace = true, features = ["getrandom"] }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["alloc", "serde", "wasmbind", "now"] }
serde_cbor = { workspace = true, features = ["std", "tags"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
sha2 = { workspace = true }
prost = { workspace = true }

[dev-dependencies]
dioxus-ssr = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
serde_json = { workspace = true }
