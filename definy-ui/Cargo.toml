[package]
name = "definy-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "hooks", "signals", "html"] }
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
definy-event = { path = "../definy-event" }
web-sys = { version = "0.3.103", features = [
  "console",
  "Window",
  "History",
  "Document",
  "Element",
  "Node",
  "NodeList",
  "HtmlElement",
  "Event",
  "HtmlDialogElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "Navigator",
  "Clipboard",
  "DomStringList",
  "IdbDatabase",
  "IdbFactory",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbVersionChangeEvent",
  "Request",
  "RequestInit",
  "Response",
  "Headers",
  "CredentialsContainer",
  "CredentialRequestOptions",
  "Storage",
  "Location",
] }
wasm-bindgen = "0.2.127"
rand_core = { version = "0.6.4", features = ["getrandom"] }
wasm-bindgen-futures = "0.4.76"
js-sys = "0.3.103"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "serde", "wasmbind", "now"] }
serde_cbor = { version = "0.11.2", features = ["std", "tags"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_urlencoded = "0.7"
sha2 = "0.10.9"

[dev-dependencies]
dioxus-ssr = { version = "0.7.10" }
hyper = { version = "1.11", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1"] }
http-body-util = "0.1.4"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "time"] }
serde_json = "1.0.151"
