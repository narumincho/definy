[package]
name = "definy-client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "definy_client"
path = "src/main.rs"

[features]
default = ["fullstack"]
fullstack = ["server"]
web = ["dioxus/web"]
server = []

[dependencies]
definy-ui = { workspace = true }
definy-event = { workspace = true }
dioxus = { workspace = true, features = ["launch", "macro", "hooks"] }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
base64 = { workspace = true }
chrono = { workspace = true, features = ["alloc", "serde", "wasmbind", "now"] }
anyhow = { workspace = true }
serde_cbor = { workspace = true, features = ["std", "tags"] }
sha2 = { workspace = true }
futures-channel = { workspace = true }
futures-util = { workspace = true }

# サーバー用依存 (Native 専用: WASM には一切含まれない)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
definy-server = { workspace = true }
tokio = { workspace = true, features = ["full"] }

# Web / WASM 専用依存 (WASM 専用: Native には一切含まれない)
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["console", "Window", "Document", "Element", "Node", "NodeList", "HtmlElement", "Event", "MouseEvent", "HtmlAnchorElement", "History", "PopStateEvent", "HtmlDialogElement", "Navigator", "Clipboard", "Request", "RequestInit", "Response", "Headers", "Url", "KeyboardEvent", "DomRect", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition"] }
dioxus-web = { workspace = true, features = ["hydrate"] }
getrandom = { workspace = true, features = ["js"] }
wasm-bindgen-futures = { workspace = true }
console_error_panic_hook = { workspace = true }
