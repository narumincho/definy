[package]
name = "definy-client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "definy_client"
path = "src/main.rs"

[dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2.127"
web-sys = { version = "0.3.103", features = ["console", "Window", "Document", "Element", "Node", "NodeList", "HtmlElement", "Event", "MouseEvent", "HtmlAnchorElement", "History", "PopStateEvent", "HtmlDialogElement", "Navigator", "Clipboard", "Request", "RequestInit", "Response", "Headers", "Url", "KeyboardEvent", "DomRect", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition"] }
definy-ui = { path = "../definy-ui" }
definy-event = { path = "../definy-event" }
dioxus = { version = "0.7.10", default-features = false, features = ["web", "launch", "macro", "hooks"] }
dioxus-web = { version = "0.7.10" }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
getrandom = { version = "0.2", features = ["js"] }
base64 = "0.22"
wasm-bindgen-futures = "0.4.76"
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "serde", "wasmbind", "now"] }
anyhow = "1.0.104"
serde_cbor = { version = "0.11.2", features = ["std", "tags"] }
sha2 = "0.10.9"
console_error_panic_hook = "0.1.7"
futures-channel = "0.3.34"
futures-util = "0.3.34"
