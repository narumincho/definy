[package]
name = "definy-client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2.127"
web-sys = { version = "0.3.103", features = ["console", "Window", "Document", "Element", "Node", "NodeList", "HtmlElement", "Event", "HtmlDialogElement", "Navigator", "Clipboard", "Request", "RequestInit", "Response", "Headers", "Url", "KeyboardEvent", "DomRect", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition"] }
definy-ui = { path = "../definy-ui" }
definy-event = { path = "../definy-event" }
narumincho-vdom-client = { path = "../narumincho-vdom-client" }
narumincho-vdom = { path = "../narumincho-vdom" }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
getrandom = { version = "0.2", features = ["js"] }
base64 = "0.22"
wasm-bindgen-futures = "0.4.76"
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "serde", "wasmbind", "now"] }
anyhow = "1.0.104"
serde_cbor = { version = "0.11.2", features = ["std", "tags"] }
sha2 = "0.10.9"
