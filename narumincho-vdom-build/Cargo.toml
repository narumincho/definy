[package]
name = "narumincho-vdom-build"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = { version = "1" }
futures = "0.3"
tokio-util = "0.7"
