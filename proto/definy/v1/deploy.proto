syntax = "proto3";

package definy.v1;

// DeployService provides Connect-RPC APIs for bootstrapping and deploying definy instances to cloud providers (e.g. fly.io).
service DeployService {
  // DeployInstance deploys a definy instance for a given commit/state to fly.io.
  rpc DeployInstance(DeployInstanceRequest) returns (DeployInstanceResponse);

  // GetDeployStatus retrieves the status and machine information of a deployment.
  rpc GetDeployStatus(GetDeployStatusRequest) returns (GetDeployStatusResponse);

  // ListDeployments retrieves recent deployment records.
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);

  // DeployCloudflare deploys any web application, custom script, or WebAssembly service directly to Cloudflare Workers via REST API v4.
  rpc DeployCloudflare(DeployCloudflareRequest) returns (DeployCloudflareResponse);

  // ListCloudflareWorkers lists Workers scripts associated with the given Cloudflare API token.
  rpc ListCloudflareWorkers(ListCloudflareWorkersRequest) returns (ListCloudflareWorkersResponse);
}

message DeployCloudflareRequest {
  // Cloudflare API Token (Workers Scripts Write permissions)
  string api_token = 1;
  // Cloudflare Account ID (optional; automatically resolved from token if omitted)
  optional string account_id = 2;
  // Target worker script name (optional; generated if omitted)
  optional string script_name = 3;
  // Content hash of virtual WebAssembly binary to execute in edge runtime (optional)
  optional string wasm_hash = 4;
  // Custom JavaScript/TypeScript worker entrypoint script (optional; executes any web service or API)
  optional string custom_script = 5;
  // Compile expression using self-hosted compiler core.compile-to-wasm (optional fallback)
  optional bool compile_self_hosted = 6;
  // ID of a definy Part whose expression should be compiled to WebAssembly (optional)
  optional string part_id = 7;
}

message DeployCloudflareResponse {
  // Cloudflare Worker Script Name
  string script_name = 1;
  // Deployment status (e.g. "succeeded")
  string status = 2;
  // Primary URL to access the deployed worker (e.g. "https://<script>.<subdomain>.workers.dev")
  string url = 3;
  // Result evaluated by self-hosted compiler WebAssembly binary (optional)
  optional string evaluated_result = 4;
}

message DeployInstanceRequest {
  // Target commit hash or module event hash to deploy
  optional string commit_hash = 1;
  // Optional custom name for the machine
  optional string machine_name = 2;
  // Target region (e.g. "nrt", "iad", defaults to server region)
  optional string region = 3;
  // Content hash of virtual WebAssembly binary to execute in generic runner
  optional string wasm_hash = 4;
}

message DeployInstanceResponse {
  // Unique machine ID created on fly.io
  string machine_id = 1;
  // Deployment status (e.g. "created", "started", "failed")
  string status = 2;
  // URL to access the deployed instance (e.g. "https://definy.fly.dev" or instance URL)
  string url = 3;
  // Public app URL
  string app_url = 4;
}

message GetDeployStatusRequest {
  string machine_id = 1;
}

message GetDeployStatusResponse {
  string machine_id = 1;
  string status = 2;
  string region = 3;
  string url = 4;
}

message DeploymentItem {
  string machine_id = 1;
  optional string commit_hash = 2;
  string status = 3;
  string url = 4;
  string app_url = 5;
  string region = 6;
  string created_at_rfc3339 = 7;
  optional string wasm_hash = 8;
  // Cloud provider (e.g. "flyio", "cloudflare_workers")
  optional string provider = 9;
}

message ListDeploymentsRequest {
  optional uint64 limit = 1;
}

message ListDeploymentsResponse {
  repeated DeploymentItem deployments = 1;
}

message ListCloudflareWorkersRequest {
  // Cloudflare API Token (Workers Scripts Read permissions)
  string api_token = 1;
  // Cloudflare Account ID (optional; automatically resolved from token if omitted)
  optional string account_id = 2;
}

message CloudflareWorkerItem {
  string id = 1;
  optional string created_on = 2;
  optional string modified_on = 3;
}

message ListCloudflareWorkersResponse {
  repeated CloudflareWorkerItem workers = 1;
}
