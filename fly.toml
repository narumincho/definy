app = "definy"
primary_region = "nrt"

[build]
dockerfile = "Dockerfile.flyio-deploy"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    timeout = "2s"
    path = "/api-docs/openapi.json"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

