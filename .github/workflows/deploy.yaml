on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install Dioxus CLI
        run: curl -sSL https://dioxus.dev/install.sh | bash
      - run: rustup target add wasm32-unknown-unknown
      - run: dx build --package definy-client --release
      - name: Package Static Assets and Seed Bundle
        env:
          # 未設定の場合は公開されている開発用のシステムアカウント鍵で署名される
          DEFINY_SYSTEM_ACCOUNT_SECRET_KEY: ${{ secrets.DEFINY_SYSTEM_ACCOUNT_SECRET_KEY }}
        run: bash scripts/build-assets.sh --skip-build
      - name: Provision Cloudflare D1 Binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/ensure-d1.sh
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: deploy
