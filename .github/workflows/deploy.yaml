on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - name: Install npm dependencies
        run: npm ci
      - name: Build seeds and Wasm
        run: npm run build
      # wrangler.jsonc の Worker (worker/index.ts) と public/ の静的ファイルをデプロイする (docs/cloudflare-workers-assets.md)
      - name: Deploy to Cloudflare Workers (wrangler deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
