on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - name: Install npm dependencies
        run: npm ci
      # Void 1.6 からビルドは Cloudflare Build Output (.cloudflare/output) を出し,
      # wrangler deploy はそれを拒むので void deploy でデプロイする (docs/cloudflare-workers-assets.md).
      # ビルド (npm run build) は void deploy が void.config.ts の inference.build で走らせる
      - name: Build and deploy to Cloudflare Workers (void deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Worker のバージョンにプレビュー URL が無いときの準備完了の確認に使う (無ければ空)
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: npx void deploy --platform cloudflare
