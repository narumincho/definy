name: type check and test

on: pull_request

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Dioxus CLI
        run: curl -sSL https://dioxus.dev/install.sh | bash
      - name: Register Rust problem matcher
        run: echo "::add-matcher::.github/problem-matchers/rust.json"
      - run: cargo fmt --check
      - run: dx fmt --check
      - run: cargo clippy --workspace --all-targets --message-format=short -- -D warnings
      - name: Setup Deno
        uses: denoland/setup-deno@v2
      - name: Deno fmt and lint
        run: |
          deno fmt --check
          deno lint
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install npm dependencies
        run: npm ci
      - name: TypeScript type check
        run: npm run check
      - name: Lint with oxlint
        run: npm run lint
      - name: Run Vitest tests
        run: npm test
      - name: Build with Void (Vite)
        run: npm run build
      - name: Setup ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}' | cut -d '.' -f 1)
          npx -y @puppeteer/browsers install chromedriver@${CHROME_VERSION} --path /tmp/browsers
          CHROMEDRIVER_BIN=$(find /tmp/browsers -name chromedriver -type f)
          sudo ln -sf "$CHROMEDRIVER_BIN" /usr/local/bin/chromedriver
          chromedriver --version
      - run: rustup target add wasm32-unknown-unknown
      - name: Build Worker runtime (definy-worker-runtime for wasm32)
        run: |
          cargo clippy -p definy-worker-runtime --target wasm32-unknown-unknown --message-format=short -- -D warnings
          bash scripts/build-worker-runtime.sh
      - run: dx build --package definy-client
      - run: cargo test --workspace --lib --bins --tests
      - name: Deno test (Worker with the Rust runtime and seed bundle)
        run: |
          cargo run -p definy-server -- --export-seed-bundle worker/generated/test_seed_bundle.json
          deno test --allow-read worker/
      - name: Run E2E test
        run: |
          chromedriver --port=4444 > /tmp/chromedriver.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://localhost:4444/status > /dev/null; then
              break
            fi
            sleep 1
          done
          WEBDRIVER_URL=http://localhost:4444 \
          E2E_BROWSER=chrome \
          cargo test -p definy-server --test browser_e2e -- --ignored --test-threads=1
