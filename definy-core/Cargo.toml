[package]
name = "definy-core"
version = "0.1.0"
edition = "2024"

[dependencies]
definy-event = { workspace = true }
ed25519-dalek = { workspace = true }
chrono = { workspace = true }
wasmi = { workspace = true, optional = true }

[features]
# Rust 製 Wasm インタプリタ wasmi による実行バックエンド (`wasm_emitter::wasmi_backend`)。
# wasm32 では `execute_wasm` も wasmi で実行する（実行時に Wasm をコンパイルできない
# Cloudflare Workers 向け）。
wasmi = ["dep:wasmi"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { workspace = true }

